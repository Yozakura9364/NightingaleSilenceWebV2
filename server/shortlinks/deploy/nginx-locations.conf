# Add these locations to the active HTTPS server block. Production currently
# loads /www/wwwroot/NightingaleSilenceWeb/conf.d/NSHome.conf through the
# 1Panel OpenResty container.
location ^~ /internal/short-links {
    return 404;
}

location ^~ /go/ {
    proxy_pass http://172.17.0.1:18768;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Never proxy /internal/short-links from a public server block.
