# Add this location to the active HTTPS server block before `location /`.
# Production loads /www/wwwroot/NightingaleSilenceWeb/conf.d/NSHome.conf through
# the 1Panel OpenResty container. The existing /glamour/ API proxy must remain.
# V2's hash router performs the final client-side route adaptation after this
# location serves the same static index as the rest of the site.
location ~ "^/g/([A-Za-z0-9]{1,10})/?$" {
    try_files /index.html =404;
}
